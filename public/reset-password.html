<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Choose a new password — Grade Portal</title>
<link rel="stylesheet" href="/assets/app.css">
</head><body>
<div class="login-shell">
  <main class="login-box">
    <div class="head"><span class="wordmark">grade<span class="gold">portal</span></span><p>Instructor account recovery</p></div>
    <form id="f">
      <div class="field"><label for="pw">New password (at least 8 characters)</label><input id="pw" type="password" autocomplete="new-password" required minlength="8"></div>
      <div class="field"><label for="cf">Confirm new password</label><input id="cf" type="password" autocomplete="new-password" required minlength="8"></div>
      <button class="btn" id="go" type="submit">Set new password</button>
      <p class="msg" id="msg" role="alert"></p>
      <p class="note"><a href="/login">Back to sign in</a></p>
    </form>
  </main>
</div>
<script src="/assets/reset-password.js"></script>
</body></html>
