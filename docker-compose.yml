# Grade Portal: app + PostgreSQL + Caddy (HTTPS).  Start with:  docker compose up -d --build
name: grade-portal

services:
  db:
    image: postgres:17-alpine          # major version is pinned: upgrading Postgres needs a dump/restore
    restart: unless-stopped
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]                # not published to the host or the LAN; only the app can reach it

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: portal
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: portal
      HOST: 0.0.0.0                    # reachable only on the internal Docker networks
      PORT: "3000"
      COOKIE_SECURE: "true"            # users always arrive over HTTPS via Caddy
      TRUST_PROXY: "1"                 # exactly one proxy (Caddy) in front
      SESSION_HOURS: "8"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend, frontend]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"                        # only redirects to HTTPS
      - "443:443"
    environment:
      PORTAL_HOST: ${PORTAL_HOST:-grades.school.lan}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data               # holds the internal CA and certificates: keep it
      - caddy_config:/config
    networks: [frontend]

networks:
  backend:
    internal: true                     # no route to the outside world
  frontend: {}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
